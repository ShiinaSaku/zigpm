name: Publish Zig Releases

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Specific version to publish (leave empty for all unpublished)"
        required: false
        type: string
      dry_run:
        description: "Dry run (no actual publish)"
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: write
  packages: write

env:
  BUN_VERSION: "canary"
  NODE_VERSION: "24"

jobs:
  detect:
    name: Detect New Releases
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.detect.outputs.versions }}
      should_publish: ${{ steps.detect.outputs.should_publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect new releases
        id: detect
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSIONS='["${{ github.event.inputs.version }}"]'
          else
            VERSIONS=$(bun run src/cli/index.ts detect)
          fi
          EOF=$(dd if=/dev/urandom bs=1 count=12 2>/dev/null | base64 | tr -dc 'a-zA-Z0-9' | head -c8)
          echo "versions<<$EOF" >> $GITHUB_OUTPUT
          echo "$VERSIONS" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
          if [ "$VERSIONS" = "[]" ]; then
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

  sync:
    name: Sync Release
    needs: detect
    if: needs.detect.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJson(needs.detect.outputs.versions) }}
      max-parallel: 1
    outputs:
      status: ${{ steps.sync.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync release
        id: sync
        run: |
          bun run src/cli/index.ts sync ${{ matrix.version }} 2>&1 | tee sync.log
          echo "status=done" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload sync logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sync-logs-${{ matrix.version }}
          path: sync.log
          retention-days: 7

  publish:
    name: Publish Release
    needs: [detect, sync]
    if: always() && needs.sync.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJson(needs.detect.outputs.versions) }}
      max-parallel: 1
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore cached packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages
          key: zigpm-packages-${{ matrix.version }}-${{ github.run_id }}
          restore-keys: |
            zigpm-packages-${{ matrix.version }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify packages
        run: |
          for dir in packages/@zigpm/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "Verified: $dir"
            fi
          done
          if [ -d "packages/root" ]; then
            echo "Root package exists"
          fi

      - name: Publish to npm
        if: ${{ !github.event.inputs.dry_run }}
        run: |
          bun run src/cli/index.ts publish ${{ matrix.version }}
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Commit published-versions.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add published-versions.json
          git diff --staged --quiet || git commit -m "chore: mark ${{ matrix.version }} as published"
          git push

      - name: Create GitHub Release
        if: ${{ !github.event.inputs.dry_run }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ matrix.version }}
          name: Zig ${{ matrix.version }}
          body: |
            ## Zig ${{ matrix.version }}

            Published to npm as [@zigpm/zig](https://www.npmjs.com/package/@zigpm/zig).

            ```bash
            npm install -g @zigpm/zig
            ```
          draft: false
          prerelease: ${{ contains(matrix.version, 'dev') || contains(matrix.version, 'beta') || contains(matrix.version, 'rc') }}
          files: |
            packages/**/bin/*

  cleanup:
    name: Cleanup
    needs: [publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "Workflow completed"
