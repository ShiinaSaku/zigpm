name: Publish Zig Releases

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific version to publish (leave empty for all unpublished)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: write
  packages: write

env:
  BUN_VERSION: '1.2.0'
  NODE_VERSION: '20'

jobs:
  detect:
    name: Detect New Releases
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.detect.outputs.versions }}
      should_publish: ${{ steps.detect.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect new releases
        id: detect
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "versions=[\"${{ github.event.inputs.version }}\"]" >> $GITHUB_OUTPUT
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            bun run src/cli/index.ts list > /dev/null 2>&1 || true
            VERSIONS=$(cat packages/.published.json 2>/dev/null || echo "[]")
            echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

  sync:
    name: Sync Release
    needs: detect
    if: needs.detect.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJson(needs.detect.outputs.versions) }}
      max-parallel: 1
    outputs:
      status: ${{ steps.sync.outputs.status }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore cached packages
        uses: actions/cache@v4
        with:
          path: packages
          key: zigpm-packages-${{ matrix.version }}-${{ github.run_id }}
          restore-keys: |
            zigpm-packages-${{ matrix.version }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync release
        id: sync
        run: |
          bun run src/cli/index.ts sync ${{ matrix.version }} 2>&1 | tee sync.log
          echo "status=done" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload sync logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs-${{ matrix.version }}
          path: sync.log
          retention-days: 7

  publish:
    name: Publish Release
    needs: [detect, sync]
    if: always() && needs.sync.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJson(needs.detect.outputs.versions) }}
      max-parallel: 1
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore cached packages
        uses: actions/cache@v4
        with:
          path: packages
          key: zigpm-packages-${{ matrix.version }}-${{ github.run_id }}
          restore-keys: |
            zigpm-packages-${{ matrix.version }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify packages
        run: |
          for dir in packages/@zigpm/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "Verified: $dir"
            fi
          done
          if [ -d "packages/root" ]; then
            echo "Root package exists"
          fi

      - name: Publish to npm
        if: ${{ !github.event.inputs.dry_run }}
        run: |
          bun run src/cli/index.ts publish ${{ matrix.version }}
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Create GitHub Release
        if: ${{ !github.event.inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ matrix.version }}
          name: Zig ${{ matrix.version }}
          body: |
            ## Zig ${{ matrix.version }}

            Published to npm as [@zigpm/zig](https://www.npmjs.com/package/@zigpm/zig).

            ```bash
            npm install -g @zigpm/zig
            ```
          draft: false
          prerelease: ${{ contains(matrix.version, 'dev') || contains(matrix.version, 'beta') || contains(matrix.version, 'rc') }}
          files: |
            packages/**/bin/*

  cleanup:
    name: Cleanup
    needs: [publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "Workflow completed"
